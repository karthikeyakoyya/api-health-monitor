apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  namespace: api-health-monitor
spec:
  replicas: 1
  selector:
    matchLabels: { app: python-api }
  template:
    metadata:
      labels: { app: python-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: python-api
          image: api-health-monitor/python-detector:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api_server:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - { name: DB_HOST, value: "postgres" }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_DB } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: python-api
  namespace: api-health-monitor
spec:
  selector: { app: python-api }
  ports:
    - port: 8000
      targetPort: 8000
