apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: api-health-monitor
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: api-health-monitor/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: api-health-monitor
spec:
  type: ClusterIP
  selector: { app: dashboard }
  ports:
    - port: 80
      targetPort: 80
