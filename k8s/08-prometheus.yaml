apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: api-health-monitor
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'java-pinger'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['java-pinger:8080']

      - job_name: 'python-api'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['python-api:8000']

      - job_name: 'python-consumer'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['python-consumer:8001']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: api-health-monitor
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: api-health-monitor
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
