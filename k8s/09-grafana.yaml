apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: api-health-monitor
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: api-health-monitor
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'API Health Monitor'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: api-health-monitor
data:
  api-health-monitor.json: |
    {
      "title": "API Health Monitor",
      "uid": "api-health-monitor",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pinger HTTP Request Rate (java-pinger)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{job=\"java-pinger\"}[1m])) by (uri, status)", "legendFormat": "{{uri}} [{{status}}]" }
          ]
        },
        {
          "id": 2,
          "title": "Backend API Request Rate (python-api)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"python-api\"}[1m])) by (handler, status)", "legendFormat": "{{handler}} [{{status}}]" }
          ]
        },
        {
          "id": 3,
          "title": "Kafka Messages Consumed (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "rate(kafka_messages_consumed_total{job=\"python-consumer\"}[1m])", "legendFormat": "messages/sec" }
          ]
        },
        {
          "id": 4,
          "title": "Anomalies Detected (by severity)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "sum(rate(anomalies_detected_total{job=\"python-consumer\"}[5m])) by (severity)", "legendFormat": "{{severity}}" }
          ]
        },
        {
          "id": 5,
          "title": "JVM Heap Used (java-pinger)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            { "expr": "jvm_memory_used_bytes{job=\"java-pinger\", area=\"heap\"}", "legendFormat": "{{id}}" }
          ]
        },
        {
          "id": 6,
          "title": "Backend API p95 Latency (python-api)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"python-api\"}[5m])) by (le, handler))", "legendFormat": "{{handler}}" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: api-health-monitor
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: "admin" }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: "admin" }
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
      volumes:
        - name: datasource
          configMap: { name: grafana-datasource }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboard-json
          configMap: { name: grafana-dashboard-json }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: api-health-monitor
spec:
  type: ClusterIP
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
